name: Issue 7423 baseline failure comparison
on:
  push:
    branches: [codex/7423-baseline-control]
permissions:
  contents: read
env:
  UV_EXCLUDE_NEWER: '2026-10-27T18:42:15Z'
jobs:
  compare:
    name: A2A baseline comparison (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ff63ab6b3e1a43c2eaa2df0ff80bc13f34858851
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: true
      - name: Install the same test dependencies
        run: |
          uv venv .venv
          uv sync --extra test --no-install-package lancedb
          uv run --no-sync python -c "import importlib.metadata as m; v=m.version('a2a-sdk'); print('a2a-sdk', v); assert v == '1.3.0', v"
      - name: Compare the failing test on unchanged main and the source branch
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/adk-baseline"
          git worktree add --detach "$baseline" d0c3af571faf71252a226bbcb4891cb08374d773
          git diff --exit-code d0c3af571faf71252a226bbcb4891cb08374d773 ff63ab6b3e1a43c2eaa2df0ff80bc13f34858851 -- pyproject.toml uv.lock tests/unittests/a2a/agent/test_remote_a2a_agent.py src/google/adk/agents/remote_a2a_agent.py
          python_bin="$GITHUB_WORKSPACE/.venv/bin/python"
          node='tests/unittests/a2a/agent/test_remote_a2a_agent.py::TestRemoteA2aAgentResolution::test_ensure_resolved_uses_custom_factory'
          for target in baseline candidate; do
            checkout="$GITHUB_WORKSPACE"
            if [ "$target" = baseline ]; then checkout="$baseline"; fi
            cd "$checkout"
            export PYTHONPATH="$checkout/src"
            "$python_bin" -c "import pathlib, google.adk; p=pathlib.Path(google.adk.__file__).resolve(); print('Testing', p); assert pathlib.Path.cwd() in p.parents"
            set +e
            "$python_bin" -m pytest "$node" --tb=short -q > "$RUNNER_TEMP/$target.log" 2>&1
            result=$?
            set -e
            cat "$RUNNER_TEMP/$target.log"
            [ "$result" = 1 ]
            grep -F "AttributeError: 'CustomFactory' object has no attribute '_httpx_client'" "$RUNNER_TEMP/$target.log"
            grep -E '^1 failed' "$RUNNER_TEMP/$target.log"
          done
          echo 'The unchanged baseline and candidate reproduce the same A2A test failure with the same environment.'
