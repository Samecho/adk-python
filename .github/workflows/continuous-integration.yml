name: PR 7532 clean mypy comparison
'on':
  push:
    branches:
    - codex/pr7532-linux-validation
permissions:
  contents: read
env:
  SKIP_PACKAGE_FLAGS: --no-install-package lancedb
jobs:
  type-check:
    name: Mypy without cache (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.11'
        - '3.12'
        - '3.13'
    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        persist-credentials: false
        ref: 743e39b6e95f0feb727ff41ea54308153e1548ba
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      with:
        enable-cache: true
    - name: Set the dependency resolution cutoff
      run: echo "UV_EXCLUDE_NEWER=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
    - name: Generate Baseline
      env:
        TARGET_BRANCH: main
      run: '# Switch to target base branch to generate baseline

        git checkout origin/$TARGET_BRANCH


        git checkout 743e39b6e95f0feb727ff41ea54308153e1548ba -- pyproject.toml


        # Install dependencies for target branch

        uv venv .venv

        source .venv/bin/activate

        uv sync --all-extras $SKIP_PACKAGE_FLAGS


        # Run mypy, filter for errors only, remove line numbers, and sort

        # We ignore exit code (|| true) because we expect errors on baseline

        uv run mypy --no-incremental . | grep "error:" | sed ''s/:\([0-9]\+\):/::/g'' | sort > baseline_errors.txt
        || true

        echo "Found $(wc -l < baseline_errors.txt) errors on $TARGET_BRANCH."

        '
    - name: Check PR Branch
      run: '# Switch back to the PR commit

        git checkout 743e39b6e95f0feb727ff41ea54308153e1548ba


        # Re-sync dependencies in case the PR changed them

        source .venv/bin/activate

        uv sync --all-extras $SKIP_PACKAGE_FLAGS


        # Run mypy on PR code, apply same processing

        uv run mypy --no-incremental . | grep "error:" | sed ''s/:\([0-9]\+\):/::/g'' | sort > pr_errors.txt
        || true

        echo "Found $(wc -l < pr_errors.txt) errors on PR branch."

        '
    - name: Compare and Fail on New Errors
      run: "echo \"Existing streaming diagnostic on baseline:\"\ngrep \"src/google/adk/utils/streaming_utils.py::\
        \ error:\" baseline_errors.txt\necho \"Existing streaming diagnostic on PR:\"\ngrep \"src/google/adk/utils/streaming_utils.py::\
        \ error:\" pr_errors.txt\n# 'comm -13' suppresses unique lines in file1 (baseline) and common\
        \ lines,\n# leaving only lines unique to file2 (PR) -> The new errors.\ncomm -13 baseline_errors.txt\
        \ pr_errors.txt > new_errors.txt\n\nif [ -s new_errors.txt ]; then\n  echo \"::error::The following\
        \ NEW mypy errors were introduced:\"\n  cat new_errors.txt\n  exit 1\nelse\n  echo \"Great job!\
        \ No new mypy errors introduced.\"\nfi\n"
